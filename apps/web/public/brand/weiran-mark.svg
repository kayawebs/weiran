<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Weiran Lab</title>
  <desc id="description">A glowing laboratory flask crossed by a creative orbit with an AI spark.</desc>
  <defs>
    <linearGradient id="surface" x1="18" y1="12" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2335"/>
      <stop offset="1" stop-color="#050A16"/>
    </linearGradient>
    <linearGradient id="signal" x1="30" y1="24" x2="101" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93DCFF"/>
      <stop offset="0.48" stop-color="#20E3BD"/>
      <stop offset="1" stop-color="#7B68FF"/>
    </linearGradient>
    <linearGradient id="liquid" x1="39" y1="75" x2="91" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B68FF"/>
      <stop offset="0.5" stop-color="#3899FF"/>
      <stop offset="1" stop-color="#20E3BD"/>
    </linearGradient>
    <clipPath id="flask-body">
      <path d="M49 42v9L29.5 87.5C24.8 96.4 31.2 107 41.3 107h45.4c10.1 0 16.5-10.6 11.8-19.5L79 51v-9H49Z"/>
    </clipPath>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#surface)"/>
  <rect x="3.75" y="3.75" width="120.5" height="120.5" rx="29.25" fill="none" stroke="#7FEBD8" stroke-opacity=".28" stroke-width="1.5"/>
  <g clip-path="url(#flask-body)">
    <path d="M25 85c12-11 23-4 31 1 10 6 18 2 28-6 9-7 17-4 23 3v30H25V85Z" fill="url(#liquid)"/>
    <circle cx="83" cy="92" r="18" fill="#20E3BD" opacity=".12"/>
  </g>
  <path d="M49 30h30M52 30v20L30 89.5C25.2 98.1 31.5 108 41.3 108h45.4c9.8 0 16.1-9.9 11.3-18.5L76 50V30" fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="61" r="4" fill="#62D5FF"/>
  <circle cx="58" cy="72" r="2.5" fill="#20E3BD"/>
  <ellipse cx="64" cy="79" rx="52" ry="21" transform="rotate(-17 64 79)" fill="none" stroke="url(#signal)" stroke-width="3.5" stroke-linecap="round" opacity=".9"/>
  <path d="M101 22c1.4 8.2 5.6 12.4 13.8 13.8-8.2 1.4-12.4 5.6-13.8 13.8-1.4-8.2-5.6-12.4-13.8-13.8 8.2-1.4 12.4-5.6 13.8-13.8Z" fill="#20E3BD" filter="url(#glow)"/>
</svg>
